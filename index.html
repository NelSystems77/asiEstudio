<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Descubre tu estilo de estudio y recibe un plan con fechas para preparar tu examen. Gratis, sin cuentas y funciona offline." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="asiEstudio · Tu estilo de estudio" />
    <meta property="og:description" content="Diagnóstico de 5 minutos y plan de estudio personalizado para tu examen." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>asiEstudio · Tu estilo de estudio</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeo.
      try {
        var t = localStorage.getItem('asiestudio-theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>asiEstudio necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
